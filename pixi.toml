[workspace]
name = "planrunner"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
tk = "*"
bluesky-queueserver-api = ">=0.0.13,<0.1"

[pypi-dependencies]
planrunner = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"

[feature.lint.dependencies]
ruff = "*"
mypy = "*"

[tasks]
planrunner = "planrunner"
# The HEX beamline queueserver. Run as the beamline operator account so the API key
# the bsqs role deploys (/etc/qs_client/<host>) is readable; otherwise it connects read only.
hex = "planrunner --server https://xf27id1-hex-qs1.nsls2.bnl.gov:443 --connect"

[feature.test.tasks]
test = "pytest -q"
# Against the local bsqs replica: devtools/bsqs-local/bsqs-local.sh up builtin
live-test = { cmd = "pytest -q tests/test_live_bsqs.py", env = { PLANRUNNER_LIVE_URI = "http://localhost:60610", PLANRUNNER_LIVE_KEY = "planrunnerdev" } }

[feature.lint.tasks]
lint = "ruff check src tests"
typecheck = "mypy src"

[environments]
default = { features = ["test", "lint"], solve-group = "default" }
