[workspace]
name = "planrunner"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
tk = "*"
bluesky-queueserver-api = ">=0.0.13,<0.1"

[pypi-dependencies]
planrunner = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"

[feature.lint.dependencies]
ruff = "*"
mypy = "*"

[tasks]
planrunner = "planrunner"

[feature.test.tasks]
test = "pytest -q"

[feature.lint.tasks]
lint = "ruff check src tests"
typecheck = "mypy src"

[environments]
default = { features = ["test", "lint"], solve-group = "default" }
