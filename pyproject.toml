[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "planrunner"
version = "0.1.0"
description = "ScriptRunner-style GUI for building, scheduling and running Bluesky plans on a bluesky-queueserver via bluesky-httpserver."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["bluesky-queueserver-api>=0.0.13"]

[project.scripts]
planrunner = "planrunner.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0911",  # match-based dispatch returns once per case
    "PLR0913",
    "PLR2004",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pyright]
venvPath = ".pixi/envs"
venv = "default"
pythonVersion = "3.12"
